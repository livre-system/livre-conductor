plugins {
    id 'com.android.application'
}

android {
    namespace 'com.livre.conductor'
    compileSdk 35

    defaultConfig {
        applicationId 'com.livre.conductor'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '2.0.0'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
            def keystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
            def keyAliasValue = System.getenv('ANDROID_KEY_ALIAS')
            def keyPasswordValue = System.getenv('ANDROID_KEY_PASSWORD')
            if (keystorePath && keystorePassword && keyAliasValue && keyPasswordValue) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.register('verifyReleaseSigning') {
    dependsOn 'assembleRelease'
    doLast {
        def apk = file("${project.buildDir}/outputs/apk/release/app-release.apk")
        if (!apk.exists()) throw new GradleException('Release APK was not generated')
        def result = new ByteArrayOutputStream()
        exec {
            commandLine android.sdkDirectory.absolutePath + '/build-tools/35.0.0/apksigner', 'verify', '--verbose', apk.absolutePath
            standardOutput = result
        }
    }
}
