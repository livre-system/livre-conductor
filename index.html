<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07080a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/logo_livre.png">
  <title>Livre · Conductor</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/styles.css?v=conductor-passenger-suite-20261118-03">
</head>
<body>

<!-- ══════════════════════════════ LOGIN ══════════════════════════════ -->
<section id="loginView">
  <div class="login-wrap">

    <div class="login-logo">
    <img src="assets/logo_livre.png" alt="Livre" class="login-logo-image">
    <span class="login-brand">Conductor</span>
  </div>

    <h1 id="authTitle">Hola de nuevo</h1>
    <p id="authSub" class="login-sub">Ingresá con tu cuenta de conductor Livre.</p>

    <form id="loginForm">
      <div id="nameField" class="login-field hidden">
        <label for="nameInput">Nombre completo</label>
        <input id="nameInput" autocomplete="name" placeholder="Juan Pérez">
      </div>
      <div class="login-field">
        <label for="username">Usuario</label>
        <input id="username" autocomplete="username" required placeholder="tu_usuario">
      </div>
      <div class="login-field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••">
      </div>
      <button id="submitBtn" class="btn-login" type="submit">Ingresar</button>
      <div id="loginError" class="login-error hidden"></div>
      <button id="toggleAuth" type="button" class="login-toggle hidden" aria-hidden="true">Registro deshabilitado</button>
    </form>

  </div>
</section>

<!-- ══════════════════════════════ APP ═══════════════════════════════ -->
<section id="appView" class="hidden">

  <!-- Topbar -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">
        <img src="assets/logo_livre.png" alt="Livre" class="topbar-logo-image">
      </div>
    </div>
    <div class="topbar-right">
      <button id="driverNotificationsButton" class="header-icon-button notification-header-button" type="button" aria-label="Notificaciones" title="Notificaciones">🔔</button>
      <button id="settingsButton" class="header-icon-button" type="button" aria-label="Abrir configuración" title="Configuración">⚙</button>
      <button id="logoutBtn" class="btn-logout">Salir</button>
    </div>
  </header>

  <!-- Mapa full-screen -->
  <div id="map"></div>

  <!-- Sheet flotante -->
  <div id="sheet" class="sheet empty-state">
    <div class="sheet-handle">
      <span class="sheet-handle-bar"></span>
    </div>
    <div id="sheetInner" class="sheet-inner">
      <!-- render() popula esto -->
    </div>
  </div>

  <div id="driver-comms" class="driver-comms" aria-label="Comunicaciones">
    <button id="passengerChatButton" class="comms-fab" type="button" aria-label="Chat con pasajero" title="Chat con pasajero">💬</button>
    <button id="handieButton" class="comms-fab handie-fab livi-fab" type="button" aria-label="Hablar con Livi" title="Hablar con Livi"><img src="assets/livi/livi-reposo.svg" alt="Livi"></button>
    <span id="handieState" class="comms-voice-status" role="status" aria-live="polite">Livi inactiva</span>
  </div>

  <div id="driverNotificationsModal" class="comms-modal hidden" role="dialog" aria-modal="true" aria-labelledby="driverNotificationsTitle">
    <div class="comms-card">
      <div class="comms-heading"><h2 id="driverNotificationsTitle">Notificaciones</h2><button id="driverNotificationsClose" type="button" aria-label="Cerrar">×</button></div>
      <div id="driverNotificationsList" class="comms-messages" aria-live="polite"><p class="comms-notice">No hay notificaciones nuevas.</p></div>
    </div>
  </div>

  <div id="passengerChatModal" class="comms-modal hidden" role="dialog" aria-modal="true" aria-labelledby="passengerChatTitle">
    <div class="comms-card">
      <div class="comms-heading"><h2 id="passengerChatTitle">Chat del viaje</h2><button id="passengerChatClose" type="button" aria-label="Cerrar">×</button></div>
      <div id="passengerMessages" class="comms-messages" aria-live="polite"></div>
      <form id="passengerMessageForm" class="comms-form"><input id="passengerMessageInput" maxlength="1000" placeholder="Escribí al pasajero…" autocomplete="off"><button type="submit" aria-label="Enviar">➤</button></form>
      <p id="passengerChatNotice" class="comms-notice" role="status"></p>
    </div>
  </div>


</section>

<div id="historyModal" class="settings-modal hidden" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="historyTitle">
  <div class="settings-card history-card">
    <div class="settings-heading"><h2 id="historyTitle">Historial y cierre</h2><button id="historyClose" class="settings-close" type="button" aria-label="Cerrar">×</button></div>
    <div class="history-filters">
      <label class="settings-field">Desde<input id="historyFrom" type="date"></label>
      <label class="settings-field">Hasta<input id="historyTo" type="date"></label>
    </div>
    <button id="historyRefresh" class="settings-preview" type="button">Actualizar historial</button>
    <div id="historySummary" class="history-summary"></div>
    <div id="historyList" class="history-list"></div>
    <div id="historyClosure" class="history-closure"></div>
    <div id="historyNotice" class="notice hidden" role="alert" aria-live="assertive"></div>
  </div>
</div>

<div id="settingsModal" class="settings-modal hidden" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="settingsTitle">
  <div class="settings-card">
    <div class="settings-heading"><h2 id="settingsTitle">Configuración</h2><button id="settingsClose" class="settings-close" type="button" aria-label="Cerrar">×</button></div>
    <label class="settings-field" for="arrivalTone">Tono de llegada de viaje
      <select id="arrivalTone"><option value="car_horn">Bocina de auto</option><option value="bus_horn">Bocina de colectivo</option><option value="truck_horn">Bocina de camión</option></select>
    </label>
    <label class="settings-field" for="themeSelect">Tema
      <select id="themeSelect"><option value="dark">Oscuro</option><option value="light">Claro</option></select>
    </label>
    <label class="settings-field" for="voiceSpeed">Velocidad de voz de Livi
      <select id="voiceSpeed"><option value="1">1x · Normal</option><option value="1.15">1,15x</option><option value="1.2">1,20x</option></select>
    </label>
    <button id="tonePreview" class="settings-preview" type="button">▶ Escuchar tono</button>
    <label class="settings-field" for="volumeRange">Volumen <output id="volumeValue">70%</output>
      <input id="volumeRange" type="range" min="0" max="100" step="1">
    </label>
    <label class="settings-field" for="fontScaleRange">Tamaño de fuente <output id="fontScaleValue">16px</output>
      <input id="fontScaleRange" type="range" min="12" max="18" step="1" value="16">
    </label>
  </div>
</div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => {});
  }
</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/app.js?v=conductor-livi-mascot-20261119-01"></script>
</body>
</html>
