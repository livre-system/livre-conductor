<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080a">
  <title>Livre · Conductor</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ══════════════════════════════ LOGIN ══════════════════════════════ -->
<section id="loginView">
  <div class="login-wrap">

    <div class="login-logo">
      <span class="logo-mark">L</span>
      <span class="login-brand">Livre Conductor</span>
    </div>

    <h1 id="authTitle">Hola de nuevo</h1>
    <p id="authSub" class="login-sub">Ingresá con tu cuenta de conductor Livre.</p>

    <form id="loginForm">
      <div id="nameField" class="login-field hidden">
        <label for="nameInput">Nombre completo</label>
        <input id="nameInput" autocomplete="name" placeholder="Juan Pérez">
      </div>
      <div class="login-field">
        <label for="username">Usuario</label>
        <input id="username" autocomplete="username" required placeholder="tu_usuario">
      </div>
      <div class="login-field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••">
      </div>
      <button id="submitBtn" class="btn-login" type="submit">Ingresar</button>
      <div id="loginError" class="login-error hidden"></div>
      <button id="toggleAuth" type="button" class="login-toggle hidden" aria-hidden="true">Registro deshabilitado</button>
    </form>

  </div>
</section>

<!-- ══════════════════════════════ APP ═══════════════════════════════ -->
<section id="appView" class="hidden">

  <!-- Topbar -->
  <header class="topbar">
    <div class="topbar-logo">
      <img src="assets/logo_livre.png" alt="Livre" class="topbar-logo-image">
    </div>
    <div class="topbar-right">
      <div id="gpsPill" class="gps-pill inactive">
        <span class="gps-dot"></span>
        <span id="gpsLabel">GPS inactivo</span>
      </div>
      <button id="themeToggle" class="header-icon-button" type="button" aria-label="Cambiar tema">☼</button>
      <button id="historyButton" class="header-icon-button" type="button" aria-label="Abrir historial">▤</button>
      <button id="settingsButton" class="header-icon-button" type="button" aria-label="Abrir configuración">⚙️</button>
      <button id="logoutBtn" class="btn-logout">Salir</button>
    </div>
  </header>

  <!-- Mapa full-screen -->
  <div id="map"></div>

  <!-- Sheet flotante -->
  <div id="sheet" class="sheet">
    <div class="sheet-handle">
      <span class="sheet-handle-bar"></span>
    </div>
    <div id="sheetInner" class="sheet-inner">
      <!-- render() popula esto -->
    </div>
  </div>

</section>

<div id="historyModal" class="settings-modal hidden" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
  <div class="settings-card history-card">
    <div class="settings-heading"><h2 id="historyTitle">Historial y cierre</h2><button id="historyClose" class="settings-close" type="button" aria-label="Cerrar">×</button></div>
    <div class="history-filters">
      <label class="settings-field">Desde<input id="historyFrom" type="date"></label>
      <label class="settings-field">Hasta<input id="historyTo" type="date"></label>
    </div>
    <button id="historyRefresh" class="settings-preview" type="button">Actualizar historial</button>
    <div id="historySummary" class="history-summary"></div>
    <div id="historyList" class="history-list"></div>
    <div id="historyClosure" class="history-closure"></div>
    <div id="historyNotice" class="notice hidden"></div>
  </div>
</div>

<div id="settingsModal" class="settings-modal hidden" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
  <div class="settings-card">
    <div class="settings-heading"><h2 id="settingsTitle">Configuración</h2><button id="settingsClose" class="settings-close" type="button" aria-label="Cerrar">×</button></div>
    <label class="settings-field" for="arrivalTone">Tono de llegada de viaje
      <select id="arrivalTone"><option value="classic">Clásico</option><option value="double">Doble</option><option value="high">Agudo</option><option value="soft">Suave</option><option value="pulse">Pulso</option></select>
    </label>
    <button id="tonePreview" class="settings-preview" type="button">▶ Escuchar tono</button>
    <label class="settings-field" for="volumeRange">Volumen <output id="volumeValue">70%</output>
      <input id="volumeRange" type="range" min="0" max="100" step="1">
    </label>
    <label class="settings-field" for="fontSizeSelect">Tamaño de fuente
      <select id="fontSizeSelect"><option value="0.9">Pequeño</option><option value="1">Normal</option><option value="1.1">Grande</option><option value="1.2">Muy grande</option></select>
    </label>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/app.js?v=logout-session-fix-1"></script>
</body>
</html>
