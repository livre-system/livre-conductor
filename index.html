<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080a">
  <title>Livre · Conductor</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ══════════════════════════════ LOGIN ══════════════════════════════ -->
<section id="loginView">
  <div class="login-wrap">

    <div class="login-logo">
      <span class="logo-mark">L</span>
      <span class="login-brand">Livre Conductor</span>
    </div>

    <h1 id="authTitle">Hola de nuevo</h1>
    <p id="authSub" class="login-sub">Ingresá con tu cuenta de conductor Livre.</p>

    <form id="loginForm">
      <div id="nameField" class="login-field hidden">
        <label for="nameInput">Nombre completo</label>
        <input id="nameInput" autocomplete="name" placeholder="Juan Pérez">
      </div>
      <div class="login-field">
        <label for="username">Usuario</label>
        <input id="username" autocomplete="username" required placeholder="tu_usuario" value="livreuser">
      </div>
      <div class="login-field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••" value="livreuser123">
      </div>
      <button id="submitBtn" class="btn-login" type="submit">Ingresar</button>
      <div id="loginError" class="login-error hidden"></div>
      <button id="toggleAuth" type="button" class="login-toggle hidden" aria-hidden="true">Registro deshabilitado</button>
    </form>

  </div>
</section>

<!-- ══════════════════════════════ APP ═══════════════════════════════ -->
<section id="appView" class="hidden">

  <!-- Topbar -->
  <header class="topbar">
    <div class="topbar-logo">
      <span class="logo-mark">L</span>
      Livre
    </div>
    <div class="topbar-right">
      <div id="gpsPill" class="gps-pill inactive">
        <span class="gps-dot"></span>
        <span id="gpsLabel">GPS inactivo</span>
      </div>
      <button id="logoutBtn" class="btn-logout">Salir</button>
    </div>
  </header>

  <!-- Mapa full-screen -->
  <div id="map"></div>

  <!-- Sheet flotante -->
  <div id="sheet" class="sheet">
    <div class="sheet-handle">
      <span class="sheet-handle-bar"></span>
    </div>
    <div id="sheetInner" class="sheet-inner">
      <!-- render() popula esto -->
    </div>
  </div>

</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/app.js"></script>
</body>
</html>
